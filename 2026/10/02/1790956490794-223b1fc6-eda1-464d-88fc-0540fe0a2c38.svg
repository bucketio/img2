<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 720" width="760" height="720">
<defs>
  <style>
    text { font-family: -apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif; }
    .mono { font-family: 'SF Mono', Menlo, Consolas, monospace; }
  </style>
  <linearGradient id="gBlue" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#1D4ED8"/><stop offset="100%" stop-color="#60A5FA"/></linearGradient>
  <linearGradient id="gOrange" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#C2410C"/><stop offset="100%" stop-color="#FB923C"/></linearGradient>
  <linearGradient id="gGreen" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#15803D"/><stop offset="100%" stop-color="#4ADE80"/></linearGradient>
  <linearGradient id="gPurple" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#6D28D9"/><stop offset="100%" stop-color="#A78BFA"/></linearGradient>
  <linearGradient id="gSlate" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#475569"/><stop offset="100%" stop-color="#94A3B8"/></linearGradient>
  <linearGradient id="gTeal" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#0F766E"/><stop offset="100%" stop-color="#2DD4BF"/></linearGradient>
  <filter id="shadowSm"><feDropShadow dx="0" dy="1" stdDeviation="3" flood-color="#64748B" flood-opacity="0.12"/></filter>
  <marker id="arr_gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#94A3B8"/></marker>
  <marker id="arr_green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#22C55E"/></marker>
  <marker id="arr_blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#3B82F6"/></marker>
  <marker id="arr_orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#F97316"/></marker>
  <marker id="arr_red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#EF4444"/></marker>
</defs>
<rect width="760" height="720" fill="#F8FAFC"/>
<text x="380" y="48" font-size="26" font-weight="800" fill="#0F172A" text-anchor="middle">群聊怎么汇进主会话</text>
<text x="380" y="76" font-size="14" font-weight="400" fill="#64748B" text-anchor="middle">每个群自己一个会话,主会话在旁边盯着,把动静合并成通知</text>
<rect x="40" y="112" width="250" height="78" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" filter="url(#shadowSm)"/>
<text x="58" y="140" font-size="14" font-weight="700" fill="#0F172A" text-anchor="start">群 A  自己一个会话</text>
<text class="mono" x="58" y="164" font-size="11" font-weight="400" fill="#64748B" text-anchor="start">agent:main:telegram:group:A</text>
<text x="58" y="180" font-size="11" font-weight="400" fill="#94A3B8" text-anchor="start">消息:● ● ● ● ●</text>
<line x1="292" y1="151" x2="316" y2="151" stroke="#3B82F6" stroke-width="2"/>
<rect x="40" y="204" width="250" height="78" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" filter="url(#shadowSm)"/>
<text x="58" y="232" font-size="14" font-weight="700" fill="#0F172A" text-anchor="start">群 B  自己一个会话</text>
<text class="mono" x="58" y="256" font-size="11" font-weight="400" fill="#64748B" text-anchor="start">agent:main:slack:channel:B</text>
<text x="58" y="272" font-size="11" font-weight="400" fill="#94A3B8" text-anchor="start">消息:● ● ● ● ●</text>
<line x1="292" y1="243" x2="316" y2="243" stroke="#3B82F6" stroke-width="2"/>
<rect x="40" y="296" width="250" height="78" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" filter="url(#shadowSm)"/>
<text x="58" y="324" font-size="14" font-weight="700" fill="#0F172A" text-anchor="start">群 C  自己一个会话</text>
<text class="mono" x="58" y="348" font-size="11" font-weight="400" fill="#64748B" text-anchor="start">agent:main:discord:channel:C</text>
<text x="58" y="364" font-size="11" font-weight="400" fill="#94A3B8" text-anchor="start">消息:● ● ● ● ●</text>
<line x1="292" y1="335" x2="316" y2="335" stroke="#3B82F6" stroke-width="2"/>
<line x1="316" y1="151" x2="316" y2="335" stroke="#3B82F6" stroke-width="2"/>
<line x1="316" y1="200" x2="340" y2="200" stroke="#3B82F6" stroke-width="2" marker-end="url(#arr_blue)"/>
<rect x="342" y="120" width="180" height="160" rx="12" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5" filter="url(#shadowSm)"/>
<text x="432" y="150" font-size="15" font-weight="700" fill="#1E40AF" text-anchor="middle">紧凑通知</text>
<text x="432" y="176" font-size="12.5" font-weight="400" fill="#1E3A8A" text-anchor="middle">每个群合并成一条</text>
<text x="432" y="198" font-size="12.5" font-weight="700" fill="#1E3A8A" text-anchor="middle">不会每条消息</text>
<text x="432" y="218" font-size="12.5" font-weight="700" fill="#1E3A8A" text-anchor="middle">唤醒一次</text>
<text x="432" y="252" font-size="11.5" font-weight="400" fill="#64748B" text-anchor="middle">队列最多 20 条</text>
<line x1="524" y1="200" x2="566" y2="200" stroke="#3B82F6" stroke-width="2.5" marker-end="url(#arr_blue)"/>
<rect x="568" y="120" width="152" height="160" rx="12" fill="url(#gBlue)" filter="url(#shadowSm)"/>
<text x="644" y="164" font-size="18" font-weight="800" fill="#FFFFFF" text-anchor="middle">主会话</text>
<text class="mono" x="644" y="190" font-size="11.5" font-weight="400" fill="#DBEAFE" text-anchor="middle">agent:main:main</text>
<text x="644" y="222" font-size="12.5" font-weight="400" fill="#FFFFFF" text-anchor="middle">agent 在这里</text>
<text x="644" y="242" font-size="12.5" font-weight="400" fill="#FFFFFF" text-anchor="middle">读到这些通知</text>
<text x="540" y="322" font-size="14" font-weight="700" fill="#0F172A" text-anchor="middle">什么时候读到?</text>
<rect x="380" y="334" width="140" height="30" rx="15" fill="#FFFFFF" stroke="#93C5FD" stroke-width="1"/>
<text x="450.0" y="353.5" font-size="12" font-weight="400" fill="#1E40AF" text-anchor="middle">你发下一条消息时</text>
<rect x="532" y="334" width="120" height="30" rx="15" fill="#FFFFFF" stroke="#93C5FD" stroke-width="1"/>
<text x="592.0" y="353.5" font-size="12" font-weight="400" fill="#1E40AF" text-anchor="middle">定时心跳时</text>
<text x="540" y="380" font-size="12" font-weight="400" fill="#64748B" text-anchor="middle">心跳默认就是打到主会话上的</text>
<line x1="40" y1="404" x2="720" y2="404" stroke="#94A3B8" stroke-width="1" stroke-dasharray="6 4"/>
<rect x="40" y="424" width="250" height="70" rx="12" fill="#F5F3FF" stroke="#C4B5FD" stroke-width="1" filter="url(#shadowSm)"/>
<text x="165" y="454" font-size="14" font-weight="700" fill="#5B21B6" text-anchor="middle">子 agent / 派生会话</text>
<text x="165" y="476" font-size="12.5" font-weight="400" fill="#4C1D95" text-anchor="middle">干完活</text>
<line x1="292" y1="459" x2="398" y2="459" stroke="#F97316" stroke-width="2.5" marker-end="url(#arr_orange)"/>
<text x="345" y="448" font-size="12" font-weight="700" fill="#9A3412" text-anchor="middle">结果回报</text>
<rect x="400" y="424" width="320" height="70" rx="12" fill="#FFF7ED" stroke="#FDBA74" stroke-width="1" filter="url(#shadowSm)"/>
<text x="560" y="454" font-size="14" font-weight="700" fill="#9A3412" text-anchor="middle">发起它的那个会话</text>
<text x="560" y="476" font-size="12.5" font-weight="400" fill="#B45309" text-anchor="middle">不一定是主会话</text>
<rect x="40" y="520" width="680" height="150" rx="12" fill="#0F172A" stroke="#0F172A" stroke-width="1" filter="url(#shadowSm)"/>
<text x="64" y="550" font-size="14" font-weight="700" fill="#FBBF24" text-anchor="start">要点</text>
<text x="64" y="578" font-size="13" font-weight="400" fill="#E2E8F0" text-anchor="start">群聊默认 per-group:每个群自己一个会话,互相隔离。</text>
<text x="64" y="600" font-size="13" font-weight="400" fill="#E2E8F0" text-anchor="start">主会话在旁边"看着"它们,看到的是合并后的通知,不是原始消息流。</text>
<text x="64" y="622" font-size="13" font-weight="400" fill="#E2E8F0" text-anchor="start">提示词里最多列出 20 个被监视的群。</text>
</svg>
