<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 720" width="760" height="720">
<defs>
  <style>
    text { font-family: -apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif; }
    .mono { font-family: 'SF Mono', Menlo, Consolas, monospace; }
  </style>
  <linearGradient id="gBlue" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#1D4ED8"/><stop offset="100%" stop-color="#60A5FA"/></linearGradient>
  <linearGradient id="gOrange" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#C2410C"/><stop offset="100%" stop-color="#FB923C"/></linearGradient>
  <linearGradient id="gGreen" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#15803D"/><stop offset="100%" stop-color="#4ADE80"/></linearGradient>
  <linearGradient id="gPurple" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#6D28D9"/><stop offset="100%" stop-color="#A78BFA"/></linearGradient>
  <linearGradient id="gSlate" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#475569"/><stop offset="100%" stop-color="#94A3B8"/></linearGradient>
  <linearGradient id="gTeal" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#0F766E"/><stop offset="100%" stop-color="#2DD4BF"/></linearGradient>
  <filter id="shadowSm"><feDropShadow dx="0" dy="1" stdDeviation="3" flood-color="#64748B" flood-opacity="0.12"/></filter>
  <marker id="arr_gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#94A3B8"/></marker>
  <marker id="arr_green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#22C55E"/></marker>
  <marker id="arr_blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#3B82F6"/></marker>
  <marker id="arr_orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#F97316"/></marker>
  <marker id="arr_red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#EF4444"/></marker>
</defs>
<rect width="760" height="720" fill="#F8FAFC"/>
<text x="380" y="48" font-size="26" font-weight="800" fill="#0F172A" text-anchor="middle">别拿过期的假设干活</text>
<text x="380" y="76" font-size="14" font-weight="400" fill="#64748B" text-anchor="middle">会话 A 被人介入之后,盯着它的会话 B 怎么知道</text>
<rect x="40" y="100" width="430" height="86" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" filter="url(#shadowSm)"/>
<text x="58" y="128" font-size="14" font-weight="700" fill="#0F172A" text-anchor="start">① 会话 A 里发生了介入</text>
<text x="58" y="150" font-size="12.5" font-weight="400" fill="#475569" text-anchor="start">9 种事件里只有 3 种会通知:</text>
<text x="58" y="170" font-size="12.5" font-weight="400" fill="#475569" text-anchor="start">有人直接发了消息、目标改了、上游丢了</text>
<rect x="40" y="216" width="430" height="70" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" filter="url(#shadowSm)"/>
<text class="mono" x="58" y="244" font-size="14" font-weight="700" fill="#0F172A" text-anchor="start">② 写进 session_state_events</text>
<text x="58" y="266" font-size="12.5" font-weight="400" fill="#475569" text-anchor="start">尽力而为:写失败只打日志,不影响原来那一轮</text>
<rect x="40" y="316" width="430" height="84" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" filter="url(#shadowSm)"/>
<text class="mono" x="58" y="344" font-size="14" font-weight="700" fill="#0F172A" text-anchor="start">③ session_watch_cursors:谁在盯谁</text>
<text x="58" y="366" font-size="12.5" font-weight="400" fill="#475569" text-anchor="start">每对 watcher 和 target 一条游标</text>
<text x="58" y="386" font-size="12.5" font-weight="400" fill="#475569" text-anchor="start">同一对同一时刻,只留一条待处理通知</text>
<line x1="255" y1="188" x2="255" y2="214" stroke="#94A3B8" stroke-width="2" marker-end="url(#arr_gray)"/>
<line x1="255" y1="288" x2="255" y2="314" stroke="#94A3B8" stroke-width="2" marker-end="url(#arr_gray)"/>
<line x1="255" y1="402" x2="255" y2="430" stroke="#94A3B8" stroke-width="2" marker-end="url(#arr_gray)"/>
<rect x="40" y="432" width="430" height="110" rx="12" fill="#FFF7ED" stroke="#FDBA74" stroke-width="1" filter="url(#shadowSm)"/>
<text x="58" y="460" font-size="14" font-weight="700" fill="#9A3412" text-anchor="start">④ 会话 B 下一轮开头,看到这条通知</text>
<text class="mono" x="58" y="486" font-size="12" font-weight="400" fill="#7C2D12" text-anchor="start">Session "…" changed (other actor).</text>
<text class="mono" x="58" y="506" font-size="12" font-weight="400" fill="#7C2D12" text-anchor="start">Reconcile before acting:</text>
<text class="mono" x="58" y="526" font-size="12" font-weight="400" fill="#7C2D12" text-anchor="start">session_status … changesSince N.</text>
<line x1="255" y1="544" x2="255" y2="572" stroke="#94A3B8" stroke-width="2" marker-end="url(#arr_gray)"/>
<rect x="40" y="574" width="430" height="92" rx="12" fill="#F0FDF4" stroke="#86EFAC" stroke-width="1" filter="url(#shadowSm)"/>
<text x="58" y="602" font-size="14" font-weight="700" fill="#166534" text-anchor="start">⑤ B 带着 changesSince = N 去拉增量</text>
<text x="58" y="628" font-size="12.5" font-weight="400" fill="#14532D" text-anchor="start">只拿 N 之后发生的事件;历史已经被清掉,</text>
<text x="58" y="648" font-size="12.5" font-weight="400" fill="#14532D" text-anchor="start">返回里会有 historyGap</text>
<text x="255" y="690" font-size="12" font-weight="400" fill="#64748B" text-anchor="middle">事件保留 30 天、最多 5 万行</text>
<rect x="494" y="100" width="226" height="442" rx="12" fill="#FEF2F2" stroke="#FCA5A5" stroke-width="1" filter="url(#shadowSm)"/>
<text x="512" y="130" font-size="14" font-weight="700" fill="#991B1B" text-anchor="start">文档自己承认的局限</text>
<text x="512" y="160" font-size="10" font-weight="400" fill="#DC2626" text-anchor="start">●</text>
<text x="530" y="160" font-size="12.5" font-weight="400" fill="#7F1D1D" text-anchor="start">记录是尽力而为的,</text>
<text x="530" y="179" font-size="12.5" font-weight="400" fill="#7F1D1D" text-anchor="start">stateVersion 不是事务级的</text>
<text x="530" y="198" font-size="12.5" font-weight="400" fill="#7F1D1D" text-anchor="start">变更版本</text>
<text x="512" y="239" font-size="10" font-weight="400" fill="#DC2626" text-anchor="start">●</text>
<text x="530" y="239" font-size="12.5" font-weight="400" fill="#7F1D1D" text-anchor="start">只假设一个 gateway 进程</text>
<text x="530" y="258" font-size="12.5" font-weight="400" fill="#7F1D1D" text-anchor="start">拥有状态库;多个 gateway</text>
<text x="530" y="277" font-size="12.5" font-weight="400" fill="#7F1D1D" text-anchor="start">不跨进程推送通知</text>
<text x="512" y="318" font-size="10" font-weight="400" fill="#DC2626" text-anchor="start">●</text>
<text x="530" y="318" font-size="12.5" font-weight="400" fill="#7F1D1D" text-anchor="start">待处理通知放在内存队列,</text>
<text x="530" y="337" font-size="12.5" font-weight="400" fill="#7F1D1D" text-anchor="start">启动时扫描重新生成</text>
<text x="512" y="378" font-size="10" font-weight="400" fill="#DC2626" text-anchor="start">●</text>
<text x="530" y="378" font-size="12.5" font-weight="400" fill="#7F1D1D" text-anchor="start">只在原生 harness 里发生的</text>
<text x="530" y="397" font-size="12.5" font-weight="400" fill="#7F1D1D" text-anchor="start">压缩,没有完整记录</text>
</svg>
