<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" width="900" height="330" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif">
  <title>L2 人机关系示意图</title>
  <desc>驾驶员全程监控 L2 组合驾驶辅助系统，系统输出控制建议驱动车辆执行，责任主体始终是驾驶员。</desc>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#888780"/>
    </marker>
  </defs>
  <rect width="900" height="330" fill="#FFFFFF"/>
  <text x="50" y="46" font-size="18" font-weight="500" fill="#2C2C2A">L2 人机关系：系统执行，人负全责</text>

  <rect x="50" y="105" width="190" height="92" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.5"/>
  <text x="145" y="145" font-size="16" font-weight="500" fill="#0C447C" text-anchor="middle">驾驶员</text>
  <text x="145" y="170" font-size="12" fill="#185FA5" text-anchor="middle">全程监管 · 手不离盘</text>
  <text x="145" y="187" font-size="12" fill="#185FA5" text-anchor="middle">眼不离路 · 随时接管</text>

  <line x1="248" y1="151" x2="292" y2="151" stroke="#888780" stroke-width="1.5" marker-end="url(#ar)"/>

  <rect x="300" y="105" width="250" height="92" rx="10" fill="#F1EFE8" stroke="#888780" stroke-width="1.5"/>
  <text x="425" y="145" font-size="16" font-weight="500" fill="#2C2C2A" text-anchor="middle">L2 组合驾驶辅助系统</text>
  <text x="425" y="170" font-size="12" fill="#5F5E5A" text-anchor="middle">ACC 纵向加减速</text>
  <text x="425" y="187" font-size="12" fill="#5F5E5A" text-anchor="middle">+ LKA 横向修正</text>

  <line x1="558" y1="151" x2="602" y2="151" stroke="#888780" stroke-width="1.5" marker-end="url(#ar)"/>

  <rect x="610" y="105" width="240" height="92" rx="10" fill="#F1EFE8" stroke="#888780" stroke-width="1.5"/>
  <text x="730" y="145" font-size="16" font-weight="500" fill="#2C2C2A" text-anchor="middle">车辆执行</text>
  <text x="730" y="170" font-size="12" fill="#5F5E5A" text-anchor="middle">仅接收控制建议</text>
  <text x="730" y="187" font-size="12" fill="#5F5E5A" text-anchor="middle">不掌握决策权</text>

  <path d="M145 105 L145 78 L425 78 L425 105" fill="none" stroke="#185FA5" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="285" y="70" font-size="12" fill="#185FA5" text-anchor="middle">实时监控</text>

  <rect x="50" y="228" width="800" height="72" rx="10" fill="#FCEBEB" stroke="#F09595" stroke-width="1.5"/>
  <text x="450" y="258" font-size="15" font-weight="500" fill="#A32D2D" text-anchor="middle">责任主体始终是驾驶员</text>
  <text x="450" y="283" font-size="12" fill="#A32D2D" text-anchor="middle">无论宣传为 L2+ 还是 L2++，系统随时可能退出，出事故由人承担后果</text>
</svg>
