<text x="576.0" y="348.0" font-size="11.5" fill="#D85A30" text-anchor="middle" font-weight="500" font-family="system-ui,&quot;Microsoft YaHei&quot;,sans-serif">输出是卷积的结果</text>
<text x="576.0" y="364.0" font-size="11" fill="#888780" text-anchor="middle" font-weight="400" font-family="system-ui,&quot;Microsoft YaHei&quot;,sans-serif">每段历史都要留痕</text>
<text x="40.0" y="386.0" font-size="11.5" fill="#888780" text-anchor="start" font-weight="400" font-family="system-ui,&quot;Microsoft YaHei&quot;,sans-serif">脉冲是一记耳光，阶跃是一次推门，任意波动才是真实工况——三者指向同一个内核。</text>
<text x="40.0" y="404.0" font-size="11.5" fill="#888780" text-anchor="start" font-weight="400" font-family="system-ui,&quot;Microsoft YaHei&quot;,sans-serif">前两种其实是第三种的特例：把进口换成 δ 函数，卷积自动退化成 E(t)。</text>
<text x="40.0" y="422.0" font-size="11.5" fill="#888780" text-anchor="start" font-weight="400" font-family="system-ui,&quot;Microsoft YaHei&quot;,sans-serif">工程上这三种注射都做得到：脉冲用注射器，阶跃用切换阀，第三种不用做——正常生产就是第三种。</text></g></svg>